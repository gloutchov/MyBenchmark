name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q benchmark.py src cases tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check required documents
        shell: python
        run: |
          from pathlib import Path
          required = [
              "README.md", "ISTRUZIONI.md", "INSTRUCTIONS.md", "SECURITY_MODEL.md",
              "PLAN.md", "MAP.md", "AGENTS.md", "LICENSE", "VERSION",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Missing required documents: {', '.join(missing)}")
