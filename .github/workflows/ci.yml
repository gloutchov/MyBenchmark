name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile Python sources
        run: python -m compileall -q benchmark.py dashboard.py src cases tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate case manifests and grader calibration
        run: python benchmark.py case validate
      - name: Check required documents
        shell: python
        run: |
          from pathlib import Path
          required = [
              "README.md", "ISTRUZIONI.md", "INSTRUCTIONS.md", "SECURITY_MODEL.md",
              "SECURITY.md", "CONTRIBUTING.md", "PLAN.md", "MAP.md", "AGENTS.md", "LICENSE", "VERSION",
              "QUICK-START_Case-Author.md", "QUICK-START_Showcase.md",
              "QUICK-START_Dashboard.md",
              "schemas/case.schema.json", "schemas/dashboard-data.schema.json",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Missing required documents: {', '.join(missing)}")
